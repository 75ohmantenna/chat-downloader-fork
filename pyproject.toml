[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-downloader"
dynamic = ["version"]
description = "Enhanced YouTube and Twitch livestream chat logging and retrieval tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "75ohmantenna", email = "75ohmantenna@proton.me" },
]
requires-python = ">=3.12"
keywords = ["youtube", "twitch", "chat", "livestream", "downloader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0,<3.0.0",
    "colorlog>=6.7.0,<7.0.0",
    "PySocks>=1.7.1",
    "websocket-client>=1.7.0,<2.0.0",
    "cloudscraper>=1.2.0,<2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=9.0,<10.0",
    "coverage>=7.0,<8.0",
    "pre-commit>=4.0,<5.0",
    "import-linter>=2.11",
]

[project.scripts]
chat_downloader = "chat_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/75ohmantenna/chat-downloader-fork"
Repository = "https://github.com/75ohmantenna/chat-downloader-fork"
"Original upstream" = "https://github.com/xenova/chat-downloader"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "chat_downloader.metadata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["chat_downloader", "chat_downloader.*"]

[tool.setuptools.package-data]
chat_downloader = ["formatting/*.json", "py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "D",    # pydocstyle
    "E4", "E7", "E9", "E501",  # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "PLC0206", "PLC0414",  # pylint convention: dict-iter, useless-alias
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TRY300",  # flake8-tryceratops: return in else
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W605", # pycodestyle warnings
    # Round-08.1d: naming conventions (N818 excluded — frozen public API exception names)
    "N",    # pep8-naming
    # Round-08.1c: error-message & exception discipline
    "EM",   # flake8-errmsg: hoist exception strings to locals
    "S",    # flake8-bandit: security checks
    "TRY",  # flake8-tryceratops
    # Round-08.1b: low-count mechanical fixes
    "PERF", # perflint
    "G",    # flake8-logging-format
    "BLE",  # flake8-blind-except
    "PLW",  # pylint warnings
    "ARG",  # flake8-unused-arguments
    "A",    # flake8-builtins
    # Round-08.1a: zero-violation correctness families
    "RSE",  # flake8-raise: unnecessary-paren-on-raise-exception
    "PGH",  # pygrep-hooks: blanket noqa/type-ignore must cite a code
    "ISC",  # flake8-implicit-str-concat
    "FLY",  # flynt: static-join-to-f-string
    "INT",  # flake8-gettext
    "PLE",  # pylint errors
    "DTZ",  # flake8-datetimez
    "PT",   # flake8-pytest-style
    # Round-10.5: boolean-argument rules — enabled after keyword-only migration
    "FBT",  # flake8-boolean-trap
]
ignore = [
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "TRY003", # raise-vanilla-args: inline exception messages are more readable; EM already governs message hygiene
    "N818",   # error-suffix-on-exception-name: exception names are in the frozen public API (test_public_api_unit.py)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "C9",    # complexity (tests are exempt)
    "D1",    # missing-docstring
    "PTH",   # use-pathlib
    "PT011", # pytest-raises-too-broad: structural test patterns; match= not always applicable
    "PT012", # pytest-raises-with-multiple-statements: signal-handler tests need sleep loops
    "ARG",   # unused-argument: mock callbacks/stubs must match callable signatures
    "BLE001",# blind-except: top-level test guards are different from production guards
    "S101",  # assert: pytest tests assert everywhere by design
    "S108",  # hardcoded-temp-file: tests use /tmp paths
    "S110",  # try-except-pass: tests sometimes need to swallow errors
    "S324",  # insecure-hash-function: tests may hash test data for convenience
    "TRY002",# raise-vanilla-class: tests raise bare exception classes for simplicity
    "EM",    # errmsg: inline exception strings are natural in test setup / mock.side_effect
    "N802",  # invalid-function-name: mock methods must match the API names they stub (e.g. WINFUNCTYPE, setFormatter)
    "N806",  # non-lowercase-variable-in-function: mock objects and Windows API constants use uppercase
    "FBT",   # boolean-argument rules: test helpers and call sites legitimately use positional booleans
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["chat_downloader"]
omit = [
    "*/__main__.py",
    "src/chat_downloader/runtime/_protocols.py",
    "src/chat_downloader/sites/_protocols.py",
    "src/chat_downloader/sites/youtube/_protocols.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.importlinter]
root_package = "chat_downloader"

[[tool.importlinter.contracts]]
name = "youtube, twitch and kick are independent"
type = "independence"
modules = [
    "chat_downloader.sites.youtube",
    "chat_downloader.sites.twitch",
    "chat_downloader.sites.kick",
]

[[tool.importlinter.contracts]]
name = "utils is a leaf"
type = "forbidden"
source_modules = ["chat_downloader.utils"]
forbidden_modules = [
    "chat_downloader.sites",
    "chat_downloader.runtime",
    "chat_downloader.output",
    "chat_downloader.formatting",
    "chat_downloader.models",
]

[[tool.importlinter.contracts]]
name = "models does not depend on runtime/output/cli/site-packages"
type = "forbidden"
source_modules = ["chat_downloader.models"]
forbidden_modules = [
    "chat_downloader.runtime",
    "chat_downloader.output",
    "chat_downloader.cli",
    "chat_downloader.cli_args",
    "chat_downloader.sites",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require external network access (not run in default CI)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
