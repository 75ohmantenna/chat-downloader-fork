[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-downloader"
dynamic = ["version"]
description = "Enhanced YouTube and Twitch livestream chat logging and retrieval tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "75ohmantenna", email = "75ohmantenna@proton.me" },
]
requires-python = ">=3.12"
keywords = ["youtube", "twitch", "chat", "livestream", "downloader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0,<3.0.0",
    "colorlog>=6.7.0,<7.0.0",
    "PySocks>=1.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=9.0,<10.0",
    "coverage>=7.0,<8.0",
]

[project.scripts]
chat_downloader = "chat_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/75ohmantenna/chat-downloader-fork"
Repository = "https://github.com/75ohmantenna/chat-downloader-fork"
"Original upstream" = "https://github.com/xenova/chat-downloader"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "chat_downloader.metadata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["chat_downloader", "chat_downloader.*"]

[tool.setuptools.package-data]
chat_downloader = ["formatting/*.json", "py.typed"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E4", "E7", "E9", "E501",  # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W605", # pycodestyle warnings
]
ignore = ["D206", "D300"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["chat_downloader"]
omit = [
    "*/__main__.py",
    "src/chat_downloader/runtime/_protocols.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require external network access (not run in default CI)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
