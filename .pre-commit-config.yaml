repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        language: system
        entry: uv run --locked ruff check src/chat_downloader tests
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff (format check)
        language: system
        entry: uv run --locked ruff format --check src/chat_downloader tests
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy (type check)
        language: system
        entry: uv run --locked mypy .
        pass_filenames: false
        stages: [pre-push]

      - id: issue-reference-check
        name: forbid issue references in fork history
        language: system
        entry: uv run --locked python scripts/check_issue_references.py
        pass_filenames: false
        stages: [pre-push]
