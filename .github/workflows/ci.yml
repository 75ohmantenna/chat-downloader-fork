name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked

      - name: Validate
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: make ci

  network-replay:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: network-replay

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked

      - name: Validate stable provider contracts
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >-
          uv run pytest -q -p no:rerunfailures
          -m network_replay --run-network
