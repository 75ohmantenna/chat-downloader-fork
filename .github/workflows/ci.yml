name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "chore/**"
      - "fix/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run --locked ruff check src/chat_downloader tests

      - name: Format check
        run: uv run --locked ruff format --check src/chat_downloader tests

      - name: Type check
        run: uv run --locked mypy .

      - name: Test
        run: uv run --locked pytest -q -p no:rerunfailures -m "not network" --tb=short

      - name: Build
        run: uv build
