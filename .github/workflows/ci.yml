name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check chat_downloader tests

      - name: Format check
        run: ruff format --check chat_downloader tests

      - name: Type check
        run: mypy .

      - name: Test
        run: pytest -q -p no:rerunfailures -m "not network" --tb=short
