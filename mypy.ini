[mypy]
# Python version
python_version = 3.12

# Import discovery
files = chat_downloader
namespace_packages = True
explicit_package_bases = True

# Strictness settings
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Error output
show_error_codes = True
show_column_numbers = True
pretty = True

# Exclude patterns
exclude = (?x)(
    ^tests/
    | ^build/
    | ^dist/
    | \.egg-info/
  )

# Third-party library stubs
# Ignore missing imports for libraries without stubs
[mypy-requests.*]
ignore_missing_imports = True

[mypy-colorlog.*]
ignore_missing_imports = True

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-setuptools]
ignore_missing_imports = True

# Windows-specific console utilities (platform-guarded code)
[mypy-chat_downloader.utils.console_utils]
ignore_errors = True

# Strict type checking for core modules
[mypy-chat_downloader.models]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.runtime.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.sites]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.sites.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.chat_downloader]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.utils.time_utils]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.utils.json_utils]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True

[mypy-chat_downloader.utils.timed_utils]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
