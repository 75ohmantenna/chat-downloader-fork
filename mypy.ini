[mypy]
# Python version
python_version = 3.12

# Import discovery
mypy_path = src
namespace_packages = True
explicit_package_bases = True

# Strictness settings
strict = True
warn_unreachable = True

# Error output
show_error_codes = True
show_column_numbers = True
pretty = True

# Exclude patterns
exclude = (?x)(
    ^tests/
    | ^build/
    | ^dist/
    | \.egg-info/
  )

# Third-party library stubs
# Ignore missing imports for libraries without stubs
[mypy-requests.*]
ignore_missing_imports = True

[mypy-colorlog.*]
ignore_missing_imports = True

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-setuptools]
ignore_missing_imports = True
